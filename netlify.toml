[build]
  publish = "apps/web/dist"
  command = "npm run build:web"

[build.environment]
  NODE_VERSION = "20"
  NETLIFY_USE_YARN = "false"
  NPM_FLAGS = "--legacy-peer-deps"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Redirect API calls to Netlify functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Stripe endpoints to Netlify function
[[redirects]]
  from = "/stripe/*"
  to = "/.netlify/functions/stripe/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev:web"
  port = 8888
  targetPort = 5173
  framework = "vite"
  autoLaunch = false