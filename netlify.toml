[build]
  publish = "apps/web/dist"
  command = "npm run build:web"

[build.environment]
  NODE_VERSION = "20"
  NETLIFY_USE_YARN = "false"
  NPM_FLAGS = "--legacy-peer-deps"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Redirect API calls to Netlify functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Stripe endpoints to Netlify function
[[redirects]]
  from = "/stripe/*"
  to = "/.netlify/functions/stripe/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------------------------------------------------------------------------
# Environment-based Stripe mode
#
# STRIPE_MODE controls whether the Stripe functions accept test or live keys.
# It must match the prefix of STRIPE_SECRET_KEY (sk_test_ / sk_live_).
# Setting STRIPE_MODE here for non-production contexts makes misconfigurations
# visible immediately via the /health endpoint and blocks accidental charges.
#
# The actual secret values (STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET,
# VITE_STRIPE_PUBLISHABLE_KEY) must be set in the Netlify UI per context
# (Site Settings → Environment Variables → Add context overrides).
#
# Beta / preview contexts  → set test keys in the UI + STRIPE_MODE = "test"
# Production context       → set live keys in the UI + STRIPE_MODE = "live"
# ---------------------------------------------------------------------------

[context.deploy-preview.environment]
  STRIPE_MODE = "test"

[context.branch-deploy.environment]
  STRIPE_MODE = "test"

[context.production.environment]
  STRIPE_MODE = "live"

[dev]
  command = "npm run dev:web"
  port = 8888
  targetPort = 5173
  framework = "vite"
  autoLaunch = false