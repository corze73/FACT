<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e3478" />
    <title>FACT is offline</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; background: #f8fafc; color: #0f172a; font-family: system-ui, sans-serif; }
      main { width: min(100%, 32rem); border-radius: 1rem; background: white; padding: 2rem; text-align: center; box-shadow: 0 16px 40px rgb(15 23 42 / 12%); }
      img { width: 5rem; height: 5rem; border-radius: 1rem; }
      h1 { margin: 1rem 0 0.5rem; font-size: 1.75rem; }
      p { margin: 0; color: #475569; font-size: 1rem; line-height: 1.6; }
      a { display: inline-flex; min-height: 44px; align-items: center; margin-top: 1.25rem; border-radius: 0.6rem; background: #1e3478; color: white; padding: 0.65rem 1rem; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/fact-192.png" alt="FACT" />
      <h1>You’re offline</h1>
      <p>FACT needs an internet connection for current coach availability, messages, bookings and payments.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
