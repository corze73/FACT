name: Health Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Probe production health endpoint
        env:
          HEALTHCHECK_URL: https://findacoachtoday.com/.netlify/functions/health
        run: |
          echo "Checking $HEALTHCHECK_URL"
          code=$(curl -sS -o /tmp/health.json -w "%{http_code}" "$HEALTHCHECK_URL")
          cat /tmp/health.json

          if [ "$code" != "200" ]; then
            echo "Health check failed with status $code"
            exit 1
          fi

          if ! jq -e '.status == "ok"' /tmp/health.json >/dev/null; then
            echo "Application health is degraded"
            exit 1
          fi

          if ! jq -e '.db.connected == true' /tmp/health.json >/dev/null; then
            echo "Database connection is unavailable"
            exit 1
          fi

          if ! jq -e '.stripe.configured == true and .stripe.mode_mismatch == false' /tmp/health.json >/dev/null; then
            echo "Stripe configuration is incomplete or mismatched"
            exit 1
          fi

          if ! jq -e '.email.configured == true' /tmp/health.json >/dev/null; then
            echo "Transactional email configuration is incomplete"
            exit 1
          fi
