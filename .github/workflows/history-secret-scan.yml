name: Weekly History Secret Scan (Report-Only)

on:
  schedule:
    # Run weekly at 03:00 UTC on Mondays
    - cron: '0 3 * * 1'
  workflow_dispatch: {}

jobs:
  trufflehog-history:
    name: TruffleHog Git History (report-only)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog on full git history (verified findings only)
        shell: bash
        run: |
          set -euo pipefail
          echo "Scanning full git history for verified secrets (report-only)..."
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/repo \
            ghcr.io/trufflesecurity/trufflehog:latest \
            git --only-verified --json --exclude-paths .github/trufflehog-exclude-paths.txt \
            file:///repo \
            > trufflehog-history.json || true
          # Never fail the workflow; this is report-only. The file will be empty if nothing was found.
          if [ -s trufflehog-history.json ]; then
            echo "Potential verified secrets were detected in history. See the uploaded artifact for details."
          else
            echo "No verified secrets detected in history."
          fi

      - name: Upload TruffleHog history report
        uses: actions/upload-artifact@v4
        with:
          name: trufflehog-history
          path: trufflehog-history.json
          if-no-files-found: warn
