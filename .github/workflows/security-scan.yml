name: Security Monitoring & Alerts

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: {} # Allow manual trigger

jobs:
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run npm audit (fail on high/critical only)
        id: npm-audit
        run: |
          npm audit --audit-level=high --json > audit-report.json || true
          VULNS=$(cat audit-report.json | jq '.metadata.vulnerabilities | .high + .critical')
          echo "vulnerabilities=$VULNS" >> $GITHUB_OUTPUT
          
          if [ "$VULNS" -gt "0" ]; then
            echo "⚠️ Found $VULNS vulnerabilities"
            npm audit
            exit 1
          fi
      
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: audit-report.json
      
      # Slack notifications disabled - uncomment and add SLACK_WEBHOOK_URL secret to enable
