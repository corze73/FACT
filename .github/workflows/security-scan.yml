  code-security:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: javascript
          queries: security-and-quality
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      # Use proper base/head depending on event type to avoid BASE==HEAD errors
      - name: TruffleHog OSS (pull_request - filesystem scan)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: filesystem --debug --only-verified --exclude-paths .github/trufflehog-exclude-paths.txt

      - name: TruffleHog OSS (push - filesystem scan)
        if: github.event_name == 'push'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: filesystem --debug --only-verified --exclude-paths .github/trufflehog-exclude-paths.txt

      # For scheduled/manual runs, scan the filesystem snapshot (no base/head)
      - name: TruffleHog OSS (filesystem)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: filesystem --debug --only-verified --exclude-paths .github/trufflehog-exclude-paths.txt

  security-headers-check:
    name: Security Headers Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Check Security Headers
        run: |
          # Use hardcoded production URL
          SITE_URL="https://findacoachtoday.com"
          
          echo "Checking security headers for $SITE_URL"
          
          # Check headers
          RESPONSE=$(curl -I -s "$SITE_URL")
          
          # Required headers
          REQUIRED_HEADERS=(
            "X-Frame-Options"
            "X-Content-Type-Options"
            "Strict-Transport-Security"
            "Content-Security-Policy"
          )
          
          MISSING_HEADERS=()
          
          for header in "${REQUIRED_HEADERS[@]}"; do
            if ! echo "$RESPONSE" | grep -qi "$header"; then
              MISSING_HEADERS+=("$header")
            fi
          done
          
          if [ ${#MISSING_HEADERS[@]} -gt 0 ]; then
            echo "❌ Missing security headers:"
            printf '%s\n' "${MISSING_HEADERS[@]}"
            exit 1
          fi
          
          echo "✅ All required security headers present"

  sql-injection-check:
    name: SQL Injection Pattern Detection
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Search for SQL injection patterns
        run: |
          echo "Searching for potential SQL injection vulnerabilities..."
          
          # Patterns that might indicate SQL injection risks
          PATTERNS=(
            '\$\{.*\}.*FROM'
            'query\(.*\+.*\)'
            'WHERE.*\+.*'
            'SELECT \* FROM .*\+.*'
          )
          
          FOUND=0
          
          for pattern in "${PATTERNS[@]}"; do
            MATCHES=$(grep -r -n -E "$pattern" src/ --include="*.js" --include="*.jsx" || true)
            if [ ! -z "$MATCHES" ]; then
              echo "⚠️ Potential SQL injection pattern found:"
              echo "$MATCHES"
              FOUND=1
            fi
          done
          
          if [ $FOUND -eq 1 ]; then
            echo "❌ Please review the code for potential SQL injection vulnerabilities"
            exit 1
          fi
          
          echo "✅ No obvious SQL injection patterns detected"

  xss-check:
    name: XSS Pattern Detection
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Search for XSS vulnerabilities
        run: |
          echo "Searching for potential XSS vulnerabilities..."
          
          # Check for dangerous patterns
          DANGEROUS=$(grep -r -n "dangerouslySetInnerHTML" src/ --include="*.jsx" --include="*.js" || true)
          INNER_HTML=$(grep -r -n "\.innerHTML" src/ --include="*.jsx" --include="*.js" || true)
          EVAL=$(grep -r -n "eval(" src/ --include="*.jsx" --include="*.js" || true)
          
          FOUND=0
          
          if [ ! -z "$DANGEROUS" ]; then
            echo "⚠️ dangerouslySetInnerHTML usage found:"
            echo "$DANGEROUS"
            FOUND=1
          fi
          
          if [ ! -z "$INNER_HTML" ]; then
            echo "⚠️ innerHTML usage found:"
            echo "$INNER_HTML"
            FOUND=1
          fi
          
          if [ ! -z "$EVAL" ]; then
            echo "❌ eval() usage found (HIGH RISK):"
            echo "$EVAL"
            exit 1
          fi
          
          if [ $FOUND -eq 1 ]; then
            echo "⚠️ Review the above for potential XSS vulnerabilities"
            # Don't fail, just warn
          else
            echo "✅ No obvious XSS patterns detected"
          fi

  env-security-check:
    name: Environment Variable Security
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Check for exposed secrets
        run: |
          echo "Checking for exposed secrets in code..."
          
          # Check for hardcoded secrets/passwords assigned to string literals
          # Use word boundaries to avoid matching identifiers like 'showPassword'
          # Exclude common UI patterns that can include '=' and quotes on the same line
          SECRETS=$(grep -r -n -I -i -E "(^|[^A-Za-z0-9_])(api_key|token|secret|password|private_key|webhook_secret|database_url)([^A-Za-z0-9_])\s*[:=]\s*['\"][^'\"]+['\"]" src/ \
            --include="*.js" --include="*.jsx" \
            | grep -v -E "showPassword|passwordVisible|<Eye|<EyeOff|type=\"password\"" \
            || true)
          
          if [ -n "$SECRETS" ]; then
            echo "⚠️ Potential hardcoded secrets found:"
            echo "$SECRETS"
            exit 1
          fi
          
          # Check for database URLs in code
          DB_URLS=$(grep -r "postgresql://" src/ --include="*.js" --include="*.jsx" || true)
          
          if [ ! -z "$DB_URLS" ]; then
            echo "❌ Database URLs found in code:"
            echo "$DB_URLS"
            exit 1
          fi
          
          echo "✅ No obvious hardcoded secrets detected"

  report:
    name: Security Report Summary
    runs-on: ubuntu-latest
    needs: [dependency-scan, code-security, secret-scan, sql-injection-check, xss-check, env-security-check]
    if: always()
    
    steps:
      - name: Generate summary
        run: |
          echo "## 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "- Dependency Scan: ${{ needs.dependency-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- CodeQL Analysis: ${{ needs.code-security.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Secret Scanning: ${{ needs.secret-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- SQL Injection Check: ${{ needs.sql-injection-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- XSS Check: ${{ needs.xss-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Environment Security: ${{ needs.env-security-check.result }}" >> $GITHUB_STEP_SUMMARY
      
