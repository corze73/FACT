version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "03:00"
    open-pull-requests-limit: 10
    assignees:
      - "corze73"
    labels:
      - "dependencies"
      - "automated"
    
    # Automatically merge minor and patch updates
    # (you can remove this if you want manual review)
    pull-request-branch-name:
      separator: "/"
    
    # Group updates to reduce PR noise
    groups:
      # Group production dependencies
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      
      # Group development dependencies
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    
    # Ignore specific updates if needed
    ignore: []
      # Example: ignore major version updates for specific packages
      # - dependency-name: "react"
      #   update-types: ["version-update:semver-major"]
    
    # Increase version requirements only when required
    versioning-strategy: increase-if-necessary
    
    # Commit message prefix
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
  
  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "github-actions"
      - "dependencies"
    commit-message:
      prefix: "ci"
